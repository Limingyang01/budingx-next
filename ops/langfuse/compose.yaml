# SP004 agent-observability §4.7.1：本机 Langfuse 部署。
# 开发者本机自建观测平台，不是生产高可用部署。
# 仅发布本机 3000（Web）与 9090（MinIO 媒体）端口；数据库不对宿主开放。
# 凭据由 scripts/langfuse/init-local.mjs 生成到 .runtime/langfuse/local.env。
# 镜像版本以实施时 docker compose pull 实际成功的稳定版为准（LANGFUSE_IMAGE_TAG）。

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
  DATABASE_URL: ${DATABASE_URL:?Run scripts/langfuse/init-local.mjs first}
  SALT: ${SALT:?Run scripts/langfuse/init-local.mjs first}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run scripts/langfuse/init-local.mjs first}
  TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
  CLICKHOUSE_MIGRATION_URL: ${CLICKHOUSE_MIGRATION_URL:-clickhouse://clickhouse:9000}
  CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run scripts/langfuse/init-local.mjs first}
  CLICKHOUSE_CLUSTER_ENABLED: ${CLICKHOUSE_CLUSTER_ENABLED:-false}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse}
  LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_EVENT_UPLOAD_REGION:-auto}
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID:-minio}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY:?Run scripts/langfuse/init-local.mjs first}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT:-http://minio:9000}
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE:-true}
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_MEDIA_UPLOAD_BUCKET:-langfuse}
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANGFUSE_S3_MEDIA_UPLOAD_REGION:-auto}
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID:-minio}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY:?Run scripts/langfuse/init-local.mjs first}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT:-http://minio:9000}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE:-true}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_AUTH: ${REDIS_AUTH:?Run scripts/langfuse/init-local.mjs first}
  REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-false}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  langfuse-worker:
    image: ${DOCKER_REGISTRY:-docker.io}/langfuse/langfuse-worker:${LANGFUSE_IMAGE_TAG:?Set LANGFUSE_IMAGE_TAG in local.env}
    restart: always
    depends_on: &infra
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *langfuse-env
    logging: *logging

  langfuse-web:
    image: ${DOCKER_REGISTRY:-docker.io}/langfuse/langfuse:${LANGFUSE_IMAGE_TAG:?Set LANGFUSE_IMAGE_TAG in local.env}
    restart: always
    depends_on: *infra
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Run scripts/langfuse/init-local.mjs first}
      # 浏览器侧媒体端点走宿主映射端口；容器内部仍走 minio:9000。
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    ports:
      - 127.0.0.1:3000:3000
    logging: *logging

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/langfuse/init-local.mjs first}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 10
    logging: *logging

  clickhouse:
    image: ${DOCKER_REGISTRY:-docker.io}/clickhouse/clickhouse-server:${CLICKHOUSE_IMAGE_TAG:-26.3}
    restart: always
    user: 101:101
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run scripts/langfuse/init-local.mjs first}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      --requirepass ${REDIS_AUTH:?Run scripts/langfuse/init-local.mjs first}
      --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 10s
      retries: 10
    logging: *logging

  minio:
    image: ${DOCKER_REGISTRY:-docker.io}/minio/minio:${MINIO_IMAGE_TAG:-latest}
    restart: always
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/langfuse/init-local.mjs first}
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || curl -sf http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    ports:
      - 127.0.0.1:9090:9000
    logging: *logging

volumes:
  langfuse_postgres_data:
    driver: local
  langfuse_clickhouse_data:
    driver: local
  langfuse_clickhouse_logs:
    driver: local
  langfuse_minio_data:
    driver: local
  langfuse_redis_data:
    driver: local
